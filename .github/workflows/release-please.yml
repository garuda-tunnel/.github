name: release-please (reusable)
on:
  workflow_call:
    inputs:
      config-file:
        description: "Path to release-please config"
        type: string
        default: release-please-config.json
      manifest-file:
        description: "Path to release-please manifest"
        type: string
        default: .release-please-manifest.json
    outputs:
      paths_released:
        description: "JSON array of package paths that had a release created"
        value: ${{ jobs.release-please.outputs.paths_released }}
      raw:
        description: "Full release-please step outputs as JSON (root keys + path-prefixed keys like '<path>--version')"
        value: ${{ jobs.release-please.outputs.raw }}
concurrency:
  group: release-please-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      paths_released: ${{ steps.release.outputs.paths_released }}
      raw: ${{ toJSON(steps.release.outputs) }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}
