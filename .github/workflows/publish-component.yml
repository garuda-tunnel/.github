name: Publish component image and chart

# Reusable workflow: build and push a Docker image to GHCR, and optionally
# package and push a Helm chart to an OCI registry.
#
# Chart publishing runs only on version tags (refs/tags/v*).
# Image publishing runs on every trigger.
#
# Required caller permissions:
#   contents: read
#   packages: write

on:
  workflow_call:
    inputs:
      image_name:
        description: "Full image name, e.g. ghcr.io/garuda-tunnel/garuda-wireguard"
        type: string
        required: true
      image_context:
        description: "Docker build context path relative to repo root"
        type: string
        required: true
      chart_path:
        description: "Path to Helm chart directory; empty string disables chart publishing"
        type: string
        required: false
        default: ''
      chart_registry:
        description: "OCI registry target for chart push"
        type: string
        required: false
        default: 'oci://ghcr.io/garuda-tunnel/charts'

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ inputs.image_name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern=v{{version}}
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.image_context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false

  publish-chart:
    if: ${{ inputs.chart_path != '' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-helm@v4
        with:
          version: 'v3.16.0'
      - name: Helm registry login
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            -u ${{ github.actor }} --password-stdin
      - name: Package and push chart
        run: |
          set -euo pipefail
          helm dependency update ${{ inputs.chart_path }}
          helm package ${{ inputs.chart_path }} --destination /tmp/chart
          helm push /tmp/chart/*.tgz ${{ inputs.chart_registry }}
