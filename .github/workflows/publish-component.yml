name: Publish component image and chart

# Reusable workflow: build and push a Docker image to GHCR, and optionally
# package and push a Helm chart to an OCI registry.
#
# On push to main: build+push image, then pin the image digest into the chart
#   (values.yaml via chart_values_file/image_values_key, OR a library template
#   via image_template_file) and commit it back to main with [skip ci].
# On v* tag: build+push image AND publish the chart to OCI (the chart already
#   carries the digest pinned by the preceding main push).
#
# Required caller permissions:
#   contents: write    (needed for the digest commit-back; caller-capped)
#   packages: write

on:
  workflow_call:
    inputs:
      image_name:
        description: "Full image name, e.g. ghcr.io/garuda-tunnel/garuda-wireguard"
        type: string
        required: true
      image_context:
        description: "Docker build context path relative to repo root"
        type: string
        required: true
      chart_path:
        description: "Path to Helm chart directory; empty string disables chart publishing"
        type: string
        required: false
        default: ''
      chart_registry:
        description: "OCI registry target for chart push"
        type: string
        required: false
        default: 'oci://ghcr.io/garuda-tunnel/charts'
      chart_values_file:
        description: "Chart values.yaml (repo-root-relative) to pin the digest into; empty disables values-file pinning"
        type: string
        required: false
        default: ''
      image_values_key:
        description: "yq dotted path in chart_values_file to set (e.g. images.wireguard)"
        type: string
        required: false
        default: ''
      image_template_file:
        description: "Library Go-template file (repo-root-relative) whose marker line is rewritten via sed; empty disables template pinning"
        type: string
        required: false
        default: ''

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ inputs.image_name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern=v{{version}}
            type=semver,pattern={{version}}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.image_context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
      - name: Install yq
        if: ${{ github.ref == 'refs/heads/main' && (inputs.chart_values_file != '' || inputs.image_template_file != '') }}
        uses: mikefarah/yq@v4
        with:
          cmd: yq --version
      - name: Pin image digest into chart values
        if: ${{ github.ref == 'refs/heads/main' && inputs.chart_values_file != '' }}
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_NAME: ${{ inputs.image_name }}
          VALUES_KEY: ${{ inputs.image_values_key }}
          VALUES_FILE: ${{ inputs.chart_values_file }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "bad digest: $DIGEST" >&2; exit 1; }
          [[ -n "$VALUES_KEY" ]] || { echo "image_values_key is empty" >&2; exit 1; }
          [[ "$VALUES_KEY" =~ ^[A-Za-z0-9_.-]+$ ]] || { echo "unsafe key: $VALUES_KEY" >&2; exit 1; }
          yq -e "(.${VALUES_KEY}) | tag" "$VALUES_FILE" >/dev/null 2>&1 || { echo "key ${VALUES_KEY} does not exist in ${VALUES_FILE}" >&2; exit 1; }
          IMAGE_REF="${IMAGE_NAME}@${DIGEST}" \
            yq -i "(.${VALUES_KEY}) = strenv(IMAGE_REF)" "$VALUES_FILE"
          if ! git diff --quiet -- "$VALUES_FILE"; then
            git config user.name  "garuda-release-bot"
            git config user.email "garuda-release-bot@users.noreply.github.com"
            git add "$VALUES_FILE"
            git commit -m "chore(images): pin ${IMAGE_NAME}@${DIGEST} [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}" || {
              git pull --rebase origin "$GITHUB_REF_NAME"
              git push origin "HEAD:${GITHUB_REF_NAME}"
            }
          fi
      - name: Pin image digest into library template
        if: ${{ github.ref == 'refs/heads/main' && inputs.image_template_file != '' }}
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_NAME: ${{ inputs.image_name }}
          TPL: ${{ inputs.image_template_file }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "bad digest: $DIGEST" >&2; exit 1; }
          n=$(grep -cE "ghcr\.io/garuda-tunnel/garuda-frr-sidecar@sha256:[0-9a-f]{64}.*frr-image-pin" "$TPL")
          [[ "$n" -eq 1 ]] || { echo "expected exactly 1 frr-image-pin marker line in $TPL, got $n" >&2; exit 1; }
          sed -i -E "/frr-image-pin/ s|ghcr\.io/garuda-tunnel/garuda-frr-sidecar@sha256:[0-9a-f]{64}|${IMAGE_NAME}@${DIGEST}|" "$TPL"
          grep -q "@${DIGEST}" "$TPL" || { echo "rewrite did not land in $TPL" >&2; exit 1; }
          if ! git diff --quiet -- "$TPL"; then
            git config user.name  "garuda-release-bot"
            git config user.email "garuda-release-bot@users.noreply.github.com"
            git add "$TPL"
            git commit -m "chore(images): pin ${IMAGE_NAME}@${DIGEST} [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}" || {
              git pull --rebase origin "$GITHUB_REF_NAME"
              git push origin "HEAD:${GITHUB_REF_NAME}"
            }
          fi

  publish-chart:
    if: ${{ inputs.chart_path != '' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-helm@v4
        with:
          version: 'v3.16.0'
      - name: Helm registry login
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            -u ${{ github.actor }} --password-stdin
      - name: Package and push chart
        run: |
          set -euo pipefail
          helm dependency update ${{ inputs.chart_path }}
          helm package ${{ inputs.chart_path }} --destination /tmp/chart
          helm push /tmp/chart/*.tgz ${{ inputs.chart_registry }}
