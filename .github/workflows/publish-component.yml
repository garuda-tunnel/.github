name: Publish component image and chart

concurrency:
  group: publish-${{ inputs.image_name }}-${{ inputs.image_tag || github.sha }}
  cancel-in-progress: false

# Reusable workflow: build+push a Docker image to GHCR and (optionally) package+push
# a Helm chart to an OCI registry. Sub-project A model:
#   - The chart pins the image by TAG = the release semver (passed as image_tag), OR by
#     DIGEST resolved at package time when pin_mode=digest.
#   - NO git commit-back. NO :latest. Dev builds (pin_mode=dev) push only sha-<shortsha>.
#
# Required caller permissions: contents: read, packages: write
# (release publishing is gated by the caller on release-please outputs; this workflow
#  itself does not write to git.)

on:
  workflow_call:
    inputs:
      image_name:
        description: "Full image name, e.g. ghcr.io/garuda-tunnel/garuda-wireguard"
        type: string
        required: true
      image_context:
        description: "Docker build context path relative to repo root"
        type: string
        required: true
      image_tag:
        description: "Release semver WITHOUT leading v (e.g. 0.2.0). Empty in dev mode."
        type: string
        required: false
        default: ''
      pin_mode:
        description: "tag | digest | dev. tag/digest=release publish; dev=image-only sha- build."
        type: string
        required: false
        default: 'tag'
      chart_path:
        description: "Helm chart dir (repo-root-relative); empty disables chart publishing"
        type: string
        required: false
        default: ''
      chart_registry:
        description: "OCI registry target for chart push"
        type: string
        required: false
        default: 'oci://ghcr.io/garuda-tunnel/charts'
      chart_image_values_key:
        description: "yq dotted path in <chart>/values.yaml to set to the digest when pin_mode=digest (e.g. images.wireguard); empty disables digest injection"
        type: string
        required: false
        default: ''
      expected_chart_version:
        description: "When set, assert the chart's Chart.yaml version equals this string (callers pass the release semver)"
        type: string
        required: false
        default: ''

jobs:
  build-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ inputs.image_name }}
          tags: |
            type=raw,value=${{ inputs.image_tag }},enable=${{ inputs.pin_mode != 'dev' && inputs.image_tag != '' }}
            type=raw,value=v${{ inputs.image_tag }},enable=${{ inputs.pin_mode != 'dev' && inputs.image_tag != '' }}
            type=sha,prefix=sha-,enable=${{ inputs.pin_mode == 'dev' }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.image_context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false

  publish-chart:
    if: ${{ inputs.chart_path != '' && inputs.pin_mode != 'dev' }}
    needs: [build-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: azure/setup-helm@v5
        with:
          version: 'v3.16.0'
      - name: Install yq
        run: |
          set -euo pipefail
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.45.1/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version
      - name: Assert chart version matches release tag
        if: ${{ inputs.expected_chart_version != '' }}
        env:
          EXPECTED: ${{ inputs.expected_chart_version }}
          CHART_PATH: ${{ inputs.chart_path }}
        run: |
          set -euo pipefail
          ACTUAL=$(yq -r '.version' "${CHART_PATH}/Chart.yaml")
          [[ "$ACTUAL" == "$EXPECTED" ]] || { echo "chart version $ACTUAL != release tag $EXPECTED" >&2; exit 1; }
      - name: Pin image digest into staged values (digest mode only)
        if: ${{ inputs.pin_mode == 'digest' && inputs.chart_image_values_key != '' }}
        env:
          DIGEST: ${{ needs.build-image.outputs.digest }}
          IMAGE_NAME: ${{ inputs.image_name }}
          VALUES_KEY: ${{ inputs.chart_image_values_key }}
          CHART_PATH: ${{ inputs.chart_path }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "bad digest: $DIGEST" >&2; exit 1; }
          [[ "$VALUES_KEY" =~ ^[A-Za-z0-9_.-]+$ ]] || { echo "unsafe key: $VALUES_KEY" >&2; exit 1; }
          # Edit ONLY the staged working copy (fed to helm package); never committed to git.
          IMAGE_REF="${IMAGE_NAME}@${DIGEST}" \
            yq -i "(.${VALUES_KEY}) = strenv(IMAGE_REF)" "${CHART_PATH}/values.yaml"
      - name: Helm registry login
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            -u ${{ github.actor }} --password-stdin
      - name: Package and push chart
        env:
          CHART_PATH: ${{ inputs.chart_path }}
          CHART_REGISTRY: ${{ inputs.chart_registry }}
        run: |
          set -euo pipefail
          helm dependency update "$CHART_PATH"
          PKG=$(helm package "$CHART_PATH" --destination /tmp/chart | awk '{print $NF}')
          helm push "$PKG" "$CHART_REGISTRY"
