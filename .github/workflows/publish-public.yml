name: Publish snapshot to public repo

# Reusable workflow: build a filtered snapshot of a private repo and push it
# as a single commit to a public target repo.
#
# The caller repo must contain .publish/manifest.yaml describing which paths
# to include and which forbidden paths to check for leaks.
#
# PUBLISH_PAT must be a fine-grained PAT with Contents: Read+Write on the
# target public repo only. It is provisioned by Terraform (org-provision).

on:
  workflow_call:
    inputs:
      public_repo:
        description: "Target public repository, e.g. garuda-tunnel/garuda"
        type: string
        required: true
      public_branch:
        description: "Branch in target repo to push to"
        type: string
        required: false
        default: 'main'
      release_message:
        description: "Commit message for the public snapshot"
        type: string
        required: true
      dry_run:
        description: "Build snapshot but do not push"
        type: boolean
        required: false
        default: false
      gitleaks_version:
        description: "Gitleaks binary version"
        type: string
        required: false
        default: '8.27.2'
    secrets:
      PUBLISH_PAT:
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    # `contents: write` is required so the workflow can push a CalVer tag back
    # into the internal (caller) repository using the runner GITHUB_TOKEN.
    # Callers MUST grant `contents: write` (default repo workflow permissions
    # are read-only) or the tag-internal step will fail with HTTP 403.
    permissions:
      contents: write
    env:
      PUBLIC_REPO: ${{ inputs.public_repo }}
      PUBLIC_BRANCH: ${{ inputs.public_branch }}
      GITLEAKS_VERSION: ${{ inputs.gitleaks_version }}
    steps:
      - name: Checkout internal (self)
        uses: actions/checkout@v6
        with:
          path: internal
          fetch-depth: 1

      - name: Install yq
        run: |
          set -euo pipefail
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Install gitleaks
        run: |
          set -euo pipefail
          wget -qO- "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar xz -C /usr/local/bin gitleaks
          sudo chmod +x /usr/local/bin/gitleaks
          gitleaks version

      - name: Validate manifest
        run: test -f internal/.publish/manifest.yaml

      - name: Checkout public (target)
        uses: actions/checkout@v6
        with:
          repository: ${{ env.PUBLIC_REPO }}
          token: ${{ secrets.PUBLISH_PAT }}
          path: public
          fetch-depth: 0
          ref: ${{ env.PUBLIC_BRANCH }}

      - name: Build snapshot from manifest
        run: |
          set -euo pipefail
          MANIFEST=internal/.publish/manifest.yaml
          STAGE=$(mktemp -d)
          echo "Stage dir: $STAGE"

          mapfile -t INCLUDES < <(yq -r '.include[]' "$MANIFEST")
          for path in "${INCLUDES[@]}"; do
            clean="${path%/}"
            if [ ! -e "internal/$clean" ]; then
              echo "::error::Manifest references missing path: $clean"
              exit 1
            fi
          done

          git -C internal archive HEAD -- "${INCLUDES[@]}" | tar -x -C "$STAGE"
          echo "STAGE_DIR=$STAGE" >> "$GITHUB_ENV"

      - name: Forbidden-paths check
        # Top-level guard: each forbidden_paths entry is checked as a path
        # relative to the snapshot root. This is intentional — entries are
        # whole include-style paths, not substring tokens. Detection of
        # secret-bearing or codename-bearing files anywhere in the tree is
        # delegated to gitleaks (next step), which has rules for that.
        run: |
          set -euo pipefail
          MANIFEST=internal/.publish/manifest.yaml
          mapfile -t FORBIDDEN_PATHS < <(yq -r '.forbidden_paths[]?' "$MANIFEST")
          for fp in "${FORBIDDEN_PATHS[@]}"; do
            if [ -e "$STAGE_DIR/$fp" ]; then
              echo "::error::Forbidden path leaked into snapshot: $fp"
              exit 1
            fi
          done

      - name: Gitleaks scan stage
        run: |
          set -euo pipefail
          gitleaks dir \
            --no-banner \
            --config internal/.publish/gitleaks.toml \
            --report-format json \
            --report-path /tmp/gitleaks-report.json \
            --exit-code 1 \
            "$STAGE_DIR"

      - name: Sync stage into public worktree
        run: |
          set -euo pipefail
          find public -mindepth 1 -maxdepth 1 \
            ! -name '.git' ! -name '.github' -exec rm -rf {} +
          rsync -a "$STAGE_DIR"/ public/

      - name: Gitleaks scan public workflows
        run: |
          set -euo pipefail
          if [ -d internal/.publish/public-workflows ]; then
            gitleaks dir \
              --no-banner \
              --config internal/.publish/gitleaks.toml \
              --report-format json \
              --report-path /tmp/gitleaks-public-workflows-report.json \
              --exit-code 1 \
              internal/.publish/public-workflows
          fi

      - name: Sync public workflows
        run: |
          set -euo pipefail
          mkdir -p public/.github/workflows
          if compgen -G "internal/.publish/public-workflows/*.yml" > /dev/null; then
            cp internal/.publish/public-workflows/*.yml public/.github/workflows/
          fi

      - name: Diff summary
        working-directory: public
        run: |
          git add -A
          git diff --cached --stat || true

      - name: Generate calver tag
        id: calver
        run: |
          set -euo pipefail
          # Format: YY.1MMDD.1HHMM  e.g. 26.10405.11013
          TAG=$(date -u +'%y.1%m%d.1%H%M')
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Calver tag: ${TAG}"

      - name: Commit and push
        if: ${{ !inputs.dry_run }}
        id: commit
        working-directory: public
        env:
          MSG: ${{ inputs.release_message }}
        run: |
          set -euo pipefail
          INTERNAL_SHA=$(git -C ../internal rev-parse HEAD)
          git config user.name  "garuda-publisher[bot]"
          git config user.email "garuda-publisher@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "${MSG}" -m "Source: garuda-internal@${INTERNAL_SHA}"
          git push origin "HEAD:${PUBLIC_BRANCH}"
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Tag internal repo
        if: ${{ !inputs.dry_run && steps.commit.outputs.published == 'true' }}
        working-directory: internal
        env:
          TAG: ${{ steps.calver.outputs.tag }}
        run: |
          set -euo pipefail
          git tag "${TAG}"
          git push origin "${TAG}"

      - name: Tag public repo
        if: ${{ !inputs.dry_run && steps.commit.outputs.published == 'true' }}
        working-directory: public
        env:
          TAG: ${{ steps.calver.outputs.tag }}
        run: |
          set -euo pipefail
          git tag "${TAG}"
          git push origin "${TAG}"
